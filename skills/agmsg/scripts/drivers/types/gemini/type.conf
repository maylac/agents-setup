# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=gemini
template=template.md
cli=gemini
# 2026-07-17: gemini CLI廃止(2026-06-18個人向け終了)によりバイナリ不在。spawn試行を止める。
# agmsg更新で上書きされたら再適用のこと。
spawnable=no
model_arg=--model
detect=GEMINI_API_KEY GOOGLE_GEMINI_CLI
